[platformio]
default_envs = esp32dev-sim
src_dir = main
include_dir = main

[env]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Imain
  -I../common
  -Icomponents/bluepad32_arduino/include
build_src_filter =
  +<*.cpp>

[env:esp32dev-sim]
; Build de base: entree manette simulee + backend servo logique.

[env:esp32dev-hybrid]
; Active l'exemple ESP32Servo pour valider un sous-ensemble de servos sur hardware.
lib_deps =
  madhephaestus/ESP32Servo
build_flags =
  ${env.build_flags}
  -DSPIDERBOT_USE_LEDC_EXAMPLE

[env:esp32dev-bt-test]
; Test DualSense uniquement: Bluepad32 via composant ESP-IDF, aucun servo, aucun Arduino.
; Affiche les entrees manette dans le moniteur serie.
framework = espidf
extra_scripts = pre:extra_scripts/pre_bt_test.py

[env:esp32dev-ps5-hybrid]
; Active DualSense via Bluepad32 + backend ESP32Servo.
; Bluepad32 s'integre via le composant ESP-IDF (components/bluepad32/),
; pas comme lib Arduino standard. Le header Bluepad32.h doit etre disponible
; via ce composant pour que le backend DualSense soit active a la compilation.
lib_deps =
  ${env:esp32dev-hybrid.lib_deps}
build_flags =
  ${env.build_flags}
  -DSPIDERBOT_USE_LEDC_EXAMPLE
  -DSPIDERBOT_USE_BLUEPAD32_EXAMPLE
