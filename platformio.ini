[platformio]
default_envs = esp32dev-sim
src_dir = .

[env]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Iesp32
  -Icommon
build_src_filter =
  +<esp32/*.cpp>
  +<common/*.cpp>
  -<raspberry_pi/>
  -<docs/>

[env:esp32dev-sim]
; Build de base: entree manette simulee + backend servo logique.

[env:esp32dev-hybrid]
; Active l'exemple LEDC pour valider un sous-ensemble de servos sur hardware.
build_flags =
  ${env.build_flags}
  -DSPIDERBOT_USE_LEDC_EXAMPLE

[env:esp32dev-ps5-hybrid]
; Active DualSense via Bluepad32 + backend LEDC.
; Le backend Bluepad32 est active seulement si Bluepad32.h est disponible
; dans votre environnement (installation locale/plateforme cible).
build_flags =
  ${env.build_flags}
  -DSPIDERBOT_USE_LEDC_EXAMPLE
  -DSPIDERBOT_USE_BLUEPAD32_EXAMPLE
